# Builds one carrier image (boot or silkd): test its crate, build per platform
# on a native runner (a kernel build under QEMU emulation takes hours), push by
# digest, and stitch the manifest so every tag resolves per-platform. Reusable:
# the images gating workflow calls this once per changed carrier, and the pushed
# sha-pinned ref is an output so os-images can base FROM the exact carrier this
# commit built; workflow_dispatch stays for building one carrier alone.
name: build-carrier

on:
  workflow_call:
    inputs:
      carrier:
        type: string
        required: true
      no_cache:
        type: boolean
        default: false
    outputs:
      image:
        description: sha-pinned carrier image ref this run pushed
        value: ${{ jobs.merge.outputs.image }}
  workflow_dispatch:
    inputs:
      carrier:
        type: choice
        options: [boot, silkd]
        required: true
      no_cache:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read version
        id: ver
        run: |
          case "${{ inputs.carrier }}" in
            boot) version=$(cat boot/kernel/VERSION) ;;
            silkd) version=$(sed -n 's/^version = "\(.*\)"/\1/p' silkd/Cargo.toml | head -1) ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: fmt + clippy + test
        working-directory: ${{ inputs.carrier == 'boot' && 'boot/init' || 'silkd' }}
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  build:
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ inputs.carrier }}
          file: ${{ inputs.carrier }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.carrier == 'boot' && format('KERNEL_VERSION={0}', needs.test.outputs.version) || '' }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ inputs.carrier }},push-by-digest=true,name-canonical=true,push=true
          no-cache: ${{ inputs.no_cache }}
          cache-from: type=gha,scope=${{ inputs.carrier }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.carrier }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.carrier }}-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [test, build]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - name: Compute sha-pinned ref
        id: ref
        # Same 7-char short SHA docker/metadata-action's type=sha emits, so
        # the ref matches the tag actually pushed below.
        run: echo "image=ghcr.io/${{ github.repository }}/${{ inputs.carrier }}:${{ needs.test.outputs.version }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ inputs.carrier }}-digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.carrier }}
          tags: |
            type=raw,value=${{ needs.test.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=${{ needs.test.outputs.version }}-

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}/${{ inputs.carrier }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ steps.ref.outputs.image }}"
