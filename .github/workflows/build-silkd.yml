# silkd is an independent build artifact, same shape as build-boot: test the
# crate, then build and push a single-file carrier image the os-images COPY
# --from. A silkd change rebuilds only this image; build-os-images re-runs via
# workflow_run to fold the new binary into base and every flavor.
name: build-silkd

on:
  push:
    branches: [main]
    paths:
      - "silkd/**"
      - "protocol/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: fmt + clippy + test
        working-directory: silkd
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read silkd version
        id: ver
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' silkd/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/silkd
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=${{ steps.ver.outputs.version }}-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: silkd
          file: silkd/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=silkd
          cache-to: type=gha,mode=max,scope=silkd
