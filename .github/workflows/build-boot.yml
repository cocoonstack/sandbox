name: build-boot

# BRANCH-ONLY (ws3-early-agent): builds -ws3 tags; revert before merge.
on:
  push:
    branches: [ws3-early-agent]
    paths:
      - "boot/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: sandbox-init tests
        working-directory: boot/init
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read kernel version
        id: ver
        run: echo "kernel=$(cat boot/kernel/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/boot
          tags: |
            type=raw,value=${{ steps.ver.outputs.kernel }}-ws3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: boot
          file: boot/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            KERNEL_VERSION=${{ steps.ver.outputs.kernel }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=boot
          cache-to: type=gha,mode=max,scope=boot
