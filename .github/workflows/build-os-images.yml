# Reusable: the images gating workflow calls this after the boot/silkd
# carriers build, passing which changed and their sha-pinned refs. It detects
# changed image dirs for the matrix, builds base then flavors, and pushes to
# ghcr; base gets install-agent.sh as a buildx secret.
#   - a changed carrier (boot or silkd) refolds into every image; otherwise
#     only the git-changed image dirs rebuild;
#   - a base change rebuilds every flavor (they are FROM base);
#   - base bases FROM the sha-pinned carrier ref when that carrier changed
#     this commit, else its mutable tag; flavors FROM this repo's base
#     (fork-safe).
name: build-os-images

on:
  workflow_call:
    inputs:
      boot_changed:
        type: boolean
        default: false
      silkd_changed:
        type: boolean
        default: false
      boot_image:
        description: sha-pinned boot carrier ref (empty = unchanged, use the mutable tag)
        type: string
        default: ""
      silkd_image:
        description: sha-pinned silkd carrier ref (empty = unchanged)
        type: string
        default: ""
      base:
        description: commit the last green images run built (empty = build all)
        type: string
        default: ""
      no_cache:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      no-cache:
        description: "Force rebuild without cache"
        type: boolean
        default: false

concurrency:
  group: build-os-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      base_matrix: ${{ steps.set-matrix.outputs.base_matrix }}
      flavor_matrix: ${{ steps.set-matrix.outputs.flavor_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Find changed Dockerfiles
        id: set-matrix
        env:
          CARRIER_CHANGED: ${{ inputs.boot_changed || inputs.silkd_changed }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          MANUAL_NO_CACHE: ${{ github.event.inputs.no-cache || inputs.no_cache }}
          BASE: ${{ inputs.base }}
          SHA: ${{ github.sha }}
        run: |
          all_names() {
            declare -gA names
            while IFS= read -r dockerfile; do
              [[ -z "$dockerfile" ]] && continue
              name=$(echo "$dockerfile" | cut -d'/' -f2)
              names[$name]=1
            done <<< "$(find os-image -name Dockerfile -type f)"
          }

          # A changed carrier (boot/silkd) refolds into every image; a manual
          # run, no known base, or a change to how the images are
          # built rebuilds all. Otherwise only the git-changed image dirs
          # rebuild. The workflow diff is last so a manual run never runs git.
          wf=.github/workflows
          if [[ "$CARRIER_CHANGED" == "true" || "$MANUAL" == "true" || -z "$BASE" ]] ||
             git diff --name-only "$BASE" "$SHA" -- "$wf/build-os-images.yml" "$wf/images.yml" | grep -q .; then
            all_names
          else
            all_changed=$(git diff --name-only "$BASE" "$SHA" -- 'os-image/' ':!*.md' | sort -u)
            declare -A names
            for f in $all_changed; do
              name=$(echo "$f" | cut -d'/' -f2)
              if [[ -n "$name" ]]; then
                names[$name]=1
              fi
            done
            # Flavors are FROM base: a base change stales every flavor.
            if [[ -n "${names[base]:-}" ]]; then
              all_names
            fi
          fi

          no_cache=false
          if [[ "$MANUAL_NO_CACHE" == "true" ]]; then
            no_cache=true
          fi
          base_entries=()
          flavor_entries=()
          for name in "${!names[@]}"; do
            platforms="linux/amd64,linux/arm64"
            if [[ -f "os-image/$name/platforms" ]]; then
              platforms=$(cat "os-image/$name/platforms")
            fi

            while IFS= read -r dockerfile; do
              [[ -z "$dockerfile" ]] && continue
              tag=$(echo "$dockerfile" | cut -d'/' -f3)
              if [[ -n "$tag" ]]; then
                entry="{\"name\":\"$name\",\"tag\":\"$tag\",\"no_cache\":\"$no_cache\",\"platforms\":\"$platforms\"}"
                if [[ "$name" == "base" ]]; then
                  base_entries+=("$entry")
                else
                  flavor_entries+=("$entry")
                fi
              fi
            done <<< "$(find "os-image/$name" -name Dockerfile -type f)"
          done

          emit() {
            local key="$1"; shift
            if [[ $# -eq 0 ]]; then
              echo "${key}={\"include\":[]}" >> "$GITHUB_OUTPUT"
            else
              local json
              json=$(IFS=,; echo "$*")
              echo "${key}={\"include\":[$json]}" >> "$GITHUB_OUTPUT"
            fi
          }
          emit base_matrix "${base_entries[@]}"
          emit flavor_matrix "${flavor_entries[@]}"

          echo "Generated matrices: $(cat "$GITHUB_OUTPUT")"

  build-base:
    needs: detect
    if: ${{ fromJson(needs.detect.outputs.base_matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.base_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read versions
        id: ver
        run: |
          echo "kernel=$(cat boot/kernel/VERSION)" >> "$GITHUB_OUTPUT"
          echo "silkd=$(sed -n 's/^version = "\(.*\)"/\1/p' silkd/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=sha,prefix=${{ matrix.tag }}-

      - name: Hash image inputs
        id: inputs
        run: |
          hash=$(find "os-image/${{ matrix.name }}" -type f ! -name Dockerfile ! -name '*.md' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: os-image/${{ matrix.name }}
          file: os-image/${{ matrix.name }}/${{ matrix.tag }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          pull: true
          # A carrier that changed this commit is pinned by its sha ref
          # (deterministic — no dependence on a mutable tag another run may
          # be overwriting); an unchanged carrier uses its stable mutable tag.
          build-args: |
            BOOT_IMAGE=${{ inputs.boot_image != '' && inputs.boot_image || format('ghcr.io/{0}/boot:{1}', github.repository, steps.ver.outputs.kernel) }}
            SILKD_IMAGE=${{ inputs.silkd_image != '' && inputs.silkd_image || format('ghcr.io/{0}/silkd:{1}', github.repository, steps.ver.outputs.silkd) }}
            INPUTS_HASH=${{ steps.inputs.outputs.hash }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: sandbox_install_agent=os-image/base/install-agent.sh
          no-cache: ${{ matrix.no_cache == 'true' }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.tag }}

  # Flavors are FROM base — they run strictly after base has pushed. When the
  # base matrix is empty (skipped), !failure() && !cancelled() still lets
  # flavors build against the already-published base.
  build-flavors:
    needs: [detect, build-base]
    if: ${{ !failure() && !cancelled() && fromJson(needs.detect.outputs.flavor_matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.flavor_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read versions
        id: ver
        run: echo "silkd=$(sed -n 's/^version = "\(.*\)"/\1/p' silkd/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=sha,prefix=${{ matrix.tag }}-

      - name: Commit time
        id: epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # SOURCE_DATE_EPOCH plus rewrite-timestamp clamp every file's mtime; a rebuild writes
      # the same layer only when the packages it installs (apt, unpinned pip) are unchanged.
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        with:
          context: os-image/${{ matrix.name }}
          file: os-image/${{ matrix.name }}/${{ matrix.tag }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          outputs: type=image,push=true,rewrite-timestamp=true
          pull: true
          # Fork-safe: without this, flavors would silently build FROM the
          # upstream repo's base via the Dockerfile default. Assumes the
          # single base:24.04 tag; revisit when a second base tag appears.
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}/base:24.04
            SILKD_IMAGE=${{ inputs.silkd_image != '' && inputs.silkd_image || format('ghcr.io/{0}/silkd:{1}', github.repository, steps.ver.outputs.silkd) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ matrix.no_cache == 'true' }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.tag }}
