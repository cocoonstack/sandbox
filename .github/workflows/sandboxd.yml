# Host-side Go: the sandboxd daemon, the SDK, and the in-process e2e module.
# protocol/ is in the paths because the SDK's corpus test consumes the
# fixtures — a fixture change must re-prove the Go round-trip.
name: sandboxd

on:
  push:
    branches: [main]
    paths:
      - "sandboxd/**"
      - "sdk/go/**"
      - "sdk/python/**"
      - "mcp/**"
      - "e2e/**"
      - "protocol/**"
      - "Makefile"
      - ".golangci.yml"
      - ".github/workflows/sandboxd.yml"
  pull_request:
    paths:
      - "sandboxd/**"
      - "sdk/go/**"
      - "sdk/python/**"
      - "mcp/**"
      - "e2e/**"
      - "protocol/**"
      - "Makefile"
      - ".golangci.yml"
      - ".github/workflows/sandboxd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: sandboxd/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Build sandboxd
        working-directory: sandboxd
        run: go build ./...

      - name: Lint
        run: make go-lint

      - name: Test
        run: make go-test

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Test TLS edge with Caddy
        working-directory: e2e
        env:
          CADDY_BIN: ${{ runner.temp }}/caddy
        run: |
          curl -fsSL --retry 3 https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz -o "$RUNNER_TEMP/caddy.tar.gz"
          printf '%s  %s\n' '8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9' "$RUNNER_TEMP/caddy.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
          GOWORK=off go test -race -count=1 -run TestCaddyTLSCluster -timeout 60s -v .
