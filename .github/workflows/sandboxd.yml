# Host-side Go: the sandboxd daemon, the SDK, and the in-process e2e module.
# protocol/ is in the paths because the SDK's corpus test consumes the
# fixtures — a fixture change must re-prove the Go round-trip.
name: sandboxd

on:
  push:
    branches: [main]
    paths:
      - "sandboxd/**"
      - "sdk/go/**"
      - "mcp/**"
      - "e2e/**"
      - "protocol/**"
      - ".github/workflows/sandboxd.yml"
  pull_request:
    paths:
      - "sandboxd/**"
      - "sdk/go/**"
      - "mcp/**"
      - "e2e/**"
      - "protocol/**"
      - ".github/workflows/sandboxd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: sandboxd/go.mod

      - name: Build sandboxd
        working-directory: sandboxd
        run: go build ./...

      - name: Lint
        run: make go-lint

      - name: Test
        run: make go-test
