# Host-side Go: the sandboxd daemon, the SDK, and the in-process e2e module.
# protocol/ is in the paths because the SDK's corpus test consumes the
# fixtures — a fixture change must re-prove the Go round-trip.
name: sandboxd

on:
  push:
    branches: [main]
    paths:
      - "sandboxd/**"
      - "sdk/go/**"
      - "sdk/python/**"
      - "mcp/**"
      - "e2e/**"
      - "protocol/**"
      - "Makefile"
      - ".golangci.yml"
      - ".goreleaser.yml"
      - ".github/workflows/sandboxd.yml"
  pull_request:
    paths:
      - "sandboxd/**"
      - "sdk/go/**"
      - "sdk/python/**"
      - "mcp/**"
      - "e2e/**"
      - "protocol/**"
      - "Makefile"
      - ".golangci.yml"
      - ".goreleaser.yml"
      - ".github/workflows/sandboxd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: sbxci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: sandboxd/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Check the release config
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.18.2
          args: check

      - name: Lint
        run: make go-lint

      - name: Test
        run: make go-test

      - name: Fuzz the guest DNS door
        working-directory: sandboxd
        run: GOWORK=off go test -run '^$' -fuzz '^FuzzDNSDoor$' -fuzztime 60s ./outbound/

      - name: Test the PostgreSQL meta store
        working-directory: sandboxd
        shell: bash
        env:
          SANDBOXD_TEST_PG_URL: postgres://postgres:sbxci@localhost:5432/postgres?sslmode=disable
        run: |
          GOWORK=off go test -race -count=1 -v ./tenants/... ./poolset/... ./archives/... ./usage/... ./moves/... ./tunnet/pg/... | tee "$RUNNER_TEMP/pg-test.log"
          GOWORK=off go test -race -count=1 -v -run 'TestTwoNodesOnOneMetaStore|TestNodesOfACell|TestAMetaStoreNodeWithoutACell' ./pool/ | tee -a "$RUNNER_TEMP/pg-test.log"
          ! grep -- '--- SKIP' "$RUNNER_TEMP/pg-test.log"

      - name: Test the tun path through a kernel exit
        working-directory: sandboxd
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends nftables conntrack ethtool
          GOWORK=off go test -c -o "$RUNNER_TEMP/udp.test" ./tunnet/udp/
          sudo SANDBOXD_TUN_EXIT_TEST=1 "$RUNNER_TEMP/udp.test" -test.run TestTrafficCrossesAKernelExit -test.v | tee "$RUNNER_TEMP/exit-test.log"
          ! grep -- '--- SKIP' "$RUNNER_TEMP/exit-test.log"

      - name: Fuzz the tun parsers
        working-directory: sandboxd
        run: |
          for t in FuzzFrameLen FuzzParseAndRewrite FuzzSegment FuzzVXLANAndARP; do
            GOWORK=off go test -run '^$' -fuzz "^$t\$" -fuzztime 30s ./tunnet/
          done

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Test TLS edge with Caddy
        working-directory: e2e
        shell: bash
        env:
          CADDY_BIN: ${{ runner.temp }}/caddy
        run: |
          curl -fsSL --retry 3 https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz -o "$RUNNER_TEMP/caddy.tar.gz"
          printf '%s  %s\n' '8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9' "$RUNNER_TEMP/caddy.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
          GOWORK=off go test -race -count=1 -run TestCaddyTLSCluster -timeout 60s -v . | tee "$RUNNER_TEMP/caddy-test.log"
          ! grep -- '--- SKIP' "$RUNNER_TEMP/caddy-test.log"
