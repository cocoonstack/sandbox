# The image chain's single entry point: one push builds the changed carriers
# (boot, silkd), then os-images once, FROM their sha-pinned refs.
name: images

on:
  push:
    branches: [main]
    paths:
      - "boot/**"
      - "silkd/**"
      - "os-image/**"
      - ".github/workflows/images.yml"
      - ".github/workflows/build-os-images.yml"
      - ".github/workflows/build-silkd.yml"
      - ".github/workflows/build-boot.yml"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      no-cache:
        description: "Force rebuild without cache"
        type: boolean
        default: false

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      boot: ${{ steps.diff.outputs.boot }}
      silkd: ${{ steps.diff.outputs.silkd }}
      osimage: ${{ steps.diff.outputs.osimage }}
      base: ${{ steps.diff.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Which areas changed
        id: diff
        env:
          EVT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # The base is the last green run's commit, not event.before: the queue cancels a pending push unbuilt.
          base=""
          if [[ "$EVT" != "workflow_dispatch" ]]; then
            base=$(gh run list --workflow images.yml --branch "$BRANCH" --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          fi
          if [[ -z "$base" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=""; boot=true; silkd=true; osimage=true
          else
            changed() { git diff --name-only "$base" "$SHA" -- "$@" ':!*.md' | grep -q .; }
            # Each area carries its own build workflow: changing how an image is
            # built must rebuild it, or the run goes green having built nothing.
            wf=.github/workflows
            changed boot/ $wf/build-boot.yml && boot=true || boot=false
            changed silkd/ $wf/build-silkd.yml && silkd=true || silkd=false
            changed os-image/ $wf/build-os-images.yml $wf/images.yml && osimage=true || osimage=false
          fi
          {
            echo "boot=$boot"
            echo "silkd=$silkd"
            echo "osimage=$osimage"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
          echo "Detected: base=${base:-none} boot=$boot silkd=$silkd osimage=$osimage"

  boot:
    needs: detect
    if: ${{ needs.detect.outputs.boot == 'true' }}
    uses: ./.github/workflows/build-boot.yml
    with:
      no_cache: ${{ github.event.inputs.no-cache == 'true' }}
    secrets: inherit

  silkd:
    needs: detect
    if: ${{ needs.detect.outputs.silkd == 'true' }}
    uses: ./.github/workflows/build-silkd.yml
    with:
      no_cache: ${{ github.event.inputs.no-cache == 'true' }}
    secrets: inherit

  os-images:
    needs: [detect, boot, silkd]
    # Run once the carriers settle (skipped counts as settled), whenever any
    # area changed. A carrier that changed passes its sha-pinned ref so base
    # pins FROM the exact artifact this commit built.
    if: ${{ !failure() && !cancelled() && (needs.detect.outputs.boot == 'true' || needs.detect.outputs.silkd == 'true' || needs.detect.outputs.osimage == 'true') }}
    uses: ./.github/workflows/build-os-images.yml
    with:
      boot_changed: ${{ needs.detect.outputs.boot == 'true' }}
      silkd_changed: ${{ needs.detect.outputs.silkd == 'true' }}
      boot_image: ${{ needs.boot.outputs.image }}
      silkd_image: ${{ needs.silkd.outputs.image }}
      base: ${{ needs.detect.outputs.base }}
      no_cache: ${{ github.event.inputs.no-cache == 'true' }}
    secrets: inherit
