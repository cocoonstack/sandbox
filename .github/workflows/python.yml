name: python

on:
  push:
    paths:
      - "sdk/python/**"
      - "protocol/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "sdk/python/**"
      - "protocol/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ruff pytest && pip install -e sdk/python
      - name: Lint
        run: cd sdk/python && ruff check .
      - name: Test
        run: cd sdk/python && pytest -q
