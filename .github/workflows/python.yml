name: python

on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "sdk/openai/**"
      - "sdk/langchain/**"
      - "mcp/**/*.py"
      - "e2e/**/*.py"
      - "ruff.toml"
      - "protocol/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "sdk/python/**"
      - "sdk/openai/**"
      - "sdk/langchain/**"
      - "mcp/**/*.py"
      - "e2e/**/*.py"
      - "ruff.toml"
      - "protocol/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ruff==0.15.22 pytest==8.4.2 mypy==1.20.2 && pip install -e sdk/python -e sdk/openai -e sdk/langchain
      - name: Lint
        run: ruff format --check . && ruff check .
      - name: Test cocoonsandbox
        run: cd sdk/python && python -m pytest -q
      - name: Type check cocoonsandbox
        run: cd sdk/python && python -m mypy
      - name: Test openai adapter
        run: cd sdk/openai && python -m pytest -q
      - name: Test langchain adapter
        run: cd sdk/langchain && python -m pytest -q
