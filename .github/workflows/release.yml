# A v* tag builds the static server binaries and publishes a GitHub release;
# SDK packages release separately via sdk-*-v* tags (publish-pypi.yml).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sandboxd/go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOWORK: off
        run: |
          mkdir -p dist
          (cd sandboxd && go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o ../dist/sandboxd-linux-amd64 .)
          (cd mcp && go build -trimpath -ldflags "-s -w" -o ../dist/sandbox-mcp-linux-amd64 .)
          (cd dist && sha256sum sandboxd-linux-amd64 sandbox-mcp-linux-amd64 > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A UI-created release or a rerun already has the release: upload into it.
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            dist/sandboxd-linux-amd64 dist/sandbox-mcp-linux-amd64 dist/SHA256SUMS ||
            gh release upload "$GITHUB_REF_NAME" --clobber \
              dist/sandboxd-linux-amd64 dist/sandbox-mcp-linux-amd64 dist/SHA256SUMS
