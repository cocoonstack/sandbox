# The guest binaries (sandbox-init, silkd) and every os-image are built from
# these bases, so their tags are pinned by digest for reproducibility and
# dependabot is what keeps the pins current — without it a pinned digest is a
# frozen, unpatched toolchain.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /silkd
      - /boot
      - /os-image/base/24.04
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    # The base image's Ubuntu release is the product's, encoded in the image dir
    # and in the published base:24.04 tag; only its digest is dependabot's to move.
    ignore:
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # The kbuild stage's Debian release is a kernel-toolchain choice; moving it
      # is a testbed boot round, not a digest refresh.
      - dependency-name: "debian"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  - package-ecosystem: cargo
    directories:
      - /silkd
      - /boot/init
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
  - package-ecosystem: gomod
    directories:
      - /sandboxd
      - /sdk/go
      - /e2e
      - /mcp
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
