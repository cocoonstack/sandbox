[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cocoonstack-sandbox-openai"
version = "0.1.1"
description = "OpenAI Agents SDK sandbox provider backed by cocoon microVMs"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = ["openai-agents>=0.17", "cocoonstack-sandbox>=0.1.5"]

[tool.setuptools.packages.find]
include = ["cocoonsandbox_openai*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
