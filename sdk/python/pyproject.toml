[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cocoonstack-sandbox"
version = "0.1.30"
description = "Python SDK for the cocoon sandbox control plane"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
readme = "README.md"

[tool.setuptools.packages.find]
include = ["cocoonsandbox*"]

[tool.setuptools.package-data]
cocoonsandbox = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["cocoonsandbox", "examples"]
