[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cocoonstack-sandbox"
version = "0.1.5"
description = "Python SDK for the cocoon sandbox control plane"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
readme = "README.md"

[tool.setuptools.packages.find]
include = ["cocoonsandbox*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["UP045"]  # keep Optional-style unions out; X | None needs 3.10 at runtime without future imports
