[package]
name = "silkd"
version = "0.1.9"
edition = "2024"
rust-version = "1.98"
description = "In-guest sandbox daemon: exec with context, processes, and files over vsock"
publish = false

[dependencies]
base64 = "0.23"
libc = "0.2"
memchr = "2"
notify = "8"
regex = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "io-util", "net", "process", "signal", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
