[package]
name = "sandbox-init"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Initramfs PID 1: assemble the EROFS+overlay rootfs and switch_root"
publish = false

[dependencies]
libc = "0.2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
